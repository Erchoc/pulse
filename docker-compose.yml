services:
  # 本地开发用 PostgreSQL (生产用阿里云 RDS, 详见 docs/DATABASE.md §1)
  postgres:
    image: postgres:15-alpine
    container_name: pulse-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-pulse}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pulse_dev}
      POSTGRES_DB: ${PG_DATABASE:-pulse}
    ports:
      # 宿主机默认映 5433 避开已有本地 PG（容器内仍是 5432）
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-pulse}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 本地缓存层 (可选; 关闭时 server 全链路走 PG)
  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # pulse server (可选; 默认从源码跑更方便)
  pulse:
    build: .
    profiles: ["full"]           # 默认不启; docker compose --profile full up 才启
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${PG_USER:-pulse}:${PG_PASSWORD:-pulse_dev}@postgres:5432/${PG_DATABASE:-pulse}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PULSE_JWT_SECRET: ${PULSE_JWT_SECRET}
      PULSE_SECRETS_KEY: ${PULSE_SECRETS_KEY}

volumes:
  pg_data:
